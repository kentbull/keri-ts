# Common Deno/Node setup for CI and release jobs, around one shared dependency cache.
#
# The cache holds the Deno cache and node_modules with the LMDB-js addon already rebuilt for KERI. Its key
# (scripts/ci/deps-cache-key.ts) changes only when dependencies, the LMDB build, the runtimes or the runner
# platform change, so Warm, the PR stage gate and the release workflows all restore the same entry and an
# exact hit installs and compiles nothing.
#
# Scripts run from this action's own repository copy (for a release, the tooling checked out beside the tag),
# against the checkout in the working directory. Procedure: docs/versioning/release-versioning.md.
name: "Common CI Setup"
description: "Deno/Node setup, shared dependency cache, install on a miss, optional LMDB addon and fmt check."

inputs:
  do-fmt-check:
    description: "Whether to run fmt:check"
    required:    false
    default:     "true"
  lmdb:
    description: "Whether the job loads the KERI LMDB addon: verify it, rebuild on a miss, and save the entry"
    required:    false
    default:     "false"

outputs:
  cache-hit:
    description: "Whether the shared dependency cache matched exactly"
    value:       ${{ steps.deps-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ env.DENO_VERSION }}

    - name:  compute the shared dependency cache key
      id:    key
      shell: bash
      run:   deno run --no-config --no-lock --allow-read --allow-env --allow-write --allow-run=c++ "$GITHUB_ACTION_PATH/../../../scripts/ci/deps-cache-key.ts"

    - name: restore the shared dependency cache
      id:   deps-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.DENO_DIR }}
          node_modules
        key:          ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.restore-prefix }}

    - name:  install deterministic workspace dependencies
      if:    steps.deps-cache.outputs.cache-hit != 'true'
      shell: bash
      run:   npm ci --ignore-scripts

    - name:  assert environment
      shell: bash
      env:
        EXPECTED_DENO_VERSION: ${{ env.DENO_VERSION }}
        EXPECTED_NODE_VERSION: ${{ env.NODE_VERSION }}
      run:   bash scripts/ci/assert-environment.sh

    # A hit is only checked; a miss rebuilds. Either way the checkout's report-lmdb-runtime gate must pass.
    - name:  verify or rebuild the KERI LMDB addon
      if:    inputs.lmdb == 'true'
      shell: bash
      run:   bash "$GITHUB_ACTION_PATH/../../../scripts/ci/ensure-lmdb-addon.sh" "${{ steps.deps-cache.outputs.cache-hit }}"

    # Only an entry with the rebuilt addon is saved, and only from a branch run: a tag or pull-request run
    # saves into a scope no later run reads (master's entries, from Warm, are what releases restore).
    - name: save the shared dependency cache
      if:   inputs.lmdb == 'true' && steps.deps-cache.outputs.cache-hit != 'true' && startsWith(github.ref, 'refs/heads/')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.DENO_DIR }}
          node_modules
        key: ${{ steps.key.outputs.key }}

    - name:  check formatting
      if:    inputs.do-fmt-check == 'true'
      shell: bash
      run:   deno task fmt:check
