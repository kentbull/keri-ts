name: Observer npm release

on:
  push:
    tags: ["observer-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm
        required: true
        default: false
        type: boolean
      # Used by the release train and for releasing one package from an existing tag by dispatch.
      tag:
        description: Package tag to release (empty means the ref this run was started on)
        required: false
        default: ""
        type: string
      train_id:
        description: Correlation id the release train sets so it can find this run
        required: false
        default: ""
        type: string

# The train finds its dispatched run by this title; every other run keeps the workflow name.
run-name: ${{ inputs.train_id != '' && format('train {0}', inputs.train_id) || 'Observer npm release' }}

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/npm-release.yml
    with:
      package: observer
      publish: ${{ github.event_name == 'push' || inputs.publish }}
      tag: ${{ inputs.tag }}
