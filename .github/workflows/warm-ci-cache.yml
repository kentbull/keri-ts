name: Warm CI dependencies

# PR merge-ref caches cannot be restored by the next PR. Publish both existing
# dependency variants on master, where every PR can restore them.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-ci-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  DENO_DIR: ${{ github.workspace }}/.deno-cache
  DENO_VERSION: "2.8.2"
  NODE_VERSION: "25.9.0"
  PYTHON_VERSION: "3.14"
  LMDB_DATA_V1: "true"
  DEPS_CACHE_KEY_PREFIX: ci-deps-v6

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        variant: [dependencies, lmdb-v1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.variant == 'lmdb-v1'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - id: setup
        uses: ./.github/actions/common-release-setup
        with:
          do-fmt-check: "false"
          cache-key-extra: ${{ matrix.variant == 'lmdb-v1' && 'lmdb-v1' || '' }}

      - name: verify or rebuild LMDB-js for KERI compatibility
        if: matrix.variant == 'lmdb-v1'
        run: |
          if [[ "${{ steps.setup.outputs.cache-hit }}" != "true" ]] || ! deno run -A scripts/ci/report-lmdb-runtime.ts; then
            deno task setup:compat-lmdb
            deno run -A scripts/ci/report-lmdb-runtime.ts
          fi
