name: Warm CI dependencies

# Saves the shared dependency cache (Deno cache and node_modules with the rebuilt KERI LMDB addon) on
# master, the one scope every pull request, stage-gate dispatch and release run can restore. The key
# (scripts/ci/deps-cache-key.ts) ignores versions and source, so the entry saved for a Version Packages
# commit is the one its release tags restore. A run whose key already exists only verifies the addon.
# Procedure: docs/versioning/release-versioning.md.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group:              warm-ci-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  DENO_DIR:       ${{ github.workspace }}/.deno-cache
  DENO_VERSION:   "2.9.8"
  NODE_VERSION:   "25.9.0"
  PYTHON_VERSION: "3.14"
  LMDB_DATA_V1:   "true"

jobs:
  warm:
    runs-on:         ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: ./.github/actions/common-release-setup
        with:
          do-fmt-check: "false"
          lmdb:         "true"
