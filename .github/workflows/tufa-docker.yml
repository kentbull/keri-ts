name: Tufa Docker

# Publish the production keri-ts service images from an already-published npm
# version. Every image installs @keri-ts/tufa from the registry, so it carries
# the exact released bytes; none is built from repository source. Each role is a
# docker/tufa/Dockerfile target whose entrypoint is that service's tufa command.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published @keri-ts/tufa version to package (for example 2.0.0)
        required: true
        type: string
      latest:
        description: Also tag the images as latest
        required: true
        default: true
        type: boolean
      push:
        description: Push to GHCR after the smoke checks pass
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/kentbull
  IMAGE_PREFIX: keri-ts-
  NODE_IMAGE_TAG: 25.9.0-bookworm-slim
  BINFMT_IMAGE: tonistiigi/binfmt@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541
  PLATFORMS: linux/amd64,linux/arm64
  # target=expected `--help` usage line; mirrors the Dockerfile role targets.
  ROLES: |
    tufa=tufa
    agent=tufa agent
    witness=tufa witness start
    hosted-witness=tufa witness backend
    watcher=tufa watcher backend
    mailbox=tufa mailbox start
    registrar=tufa registrar start
    observer=tufa observer start
    verifier=tufa verifier run
    boot=tufa boot backend
    dws-resolver=tufa dws resolver

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: require a published npm version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected an exact x.y.z version" >&2; exit 1; }
          test "$(npm view "@keri-ts/tufa@${VERSION}" version)" = "$VERSION"

      - name: prepare multi-platform builder
        run: |
          docker run --privileged --rm "$BINFMT_IMAGE" --install arm64
          docker buildx create --name tufa --driver docker-container --use

      - name: build and smoke every image on each platform
        env:
          VERSION: ${{ inputs.version }}
        run: |
          build() { # platform target tag
            docker buildx build --platform "$1" --target "$2" --load \
              --build-arg "NODE_IMAGE_TAG=${NODE_IMAGE_TAG}" \
              --build-arg "TUFA_VERSION=${VERSION}" \
              --tag "$3" docker/tufa
          }
          for platform in ${PLATFORMS//,/ }; do
            arch="${platform##*/}"
            base="local/keri-ts-tufa:${VERSION}-${arch}"
            build "$platform" tufa "$base"
            docker run --rm --platform "$platform" "$base" version | grep -F "tufa ${VERSION}"
            store="tufa-smoke-${arch}"
            docker volume create "$store"
            run() { docker run --rm --platform "$platform" -v "$store:/usr/local/var/keri" "$base" "$@"; }
            run init --name smoke --nopasscode --salt 0AAwMTIzNDU2Nzg5YWJjZGVm
            run incept --name smoke --alias one --transferable --icount 1 --isith 1 --ncount 1 --nsith 1 --toad 0
            run rotate --name smoke --alias one
            run list --name smoke | grep -F "one ("
            while IFS='=' read -r target usage; do
              [[ -n "$target" && "$target" != tufa ]] || continue
              tag="local/keri-ts-${target}:${VERSION}-${arch}"
              build "$platform" "$target" "$tag"
              docker run --rm --platform "$platform" "$tag" --help | sed -n 1p | grep -F "Usage: ${usage} "
            done <<<"$ROLES"
          done

      - name: log in to GHCR
        if: ${{ inputs.push }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: push multi-platform images
        if: ${{ inputs.push }}
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          while IFS='=' read -r target _; do
            [[ -n "$target" ]] || continue
            image="${IMAGE_NAMESPACE}/${IMAGE_PREFIX}${target}"
            tags=(--tag "${image}:${VERSION}" --tag "${image}:${VERSION%.*}")
            if [[ "$LATEST" == true ]]; then tags+=(--tag "${image}:latest"); fi
            docker buildx build --platform "$PLATFORMS" --target "$target" --push \
              --build-arg "NODE_IMAGE_TAG=${NODE_IMAGE_TAG}" \
              --build-arg "TUFA_VERSION=${VERSION}" \
              "${tags[@]}" docker/tufa
            docker buildx imagetools inspect "${image}:${VERSION}" | sed -n 1,3p
          done <<<"$ROLES"
