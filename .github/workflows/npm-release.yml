name: Shared npm release

# Releases one package from a tag: plan (skip or shard the release check), check, build and smoke the
# artifact, publish it to npm, then create the GitHub release. Called by each `<package>-npm-release.yml`,
# which npm trusts as the publisher; the release train dispatches those. The release tooling (scripts,
# smoke tests and the setup action) runs from this workflow's own commit, checked out into
# `.release-tooling`; the package that is checked, built and published is always the tag's content.
# Procedure: docs/versioning/release-versioning.md.

on:
  workflow_call:
    inputs:
      package:
        required: true
        type:     string
      publish:
        required: true
        type:     boolean
      # Set by the release train or a dispatch: the package tag to release instead of the triggering ref.
      tag:
        required: false
        type:     string
        default:  ""

env:
  DENO_DIR:     ${{ github.workspace }}/.deno-cache
  DENO_VERSION: "2.9.8"
  NODE_VERSION: "25.9.0"
  LMDB_DATA_V1: "true"

jobs:
  # Decide before any runner builds: a recorded green stage-gate run on this exact content covering the
  # package skips the release check; otherwise the check runs sharded like the PR gate (release-plan.ts).
  plan:
    runs-on:         ubuntu-latest
    timeout-minutes: 10
    outputs:
      check_needed: ${{ steps.plan.outputs.check_needed }}
      check_shards: ${{ steps.plan.outputs.check_shards }}
      train_owned:  ${{ steps.plan.outputs.train_owned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: check out the release tooling at the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:  ${{ github.sha }}
          path: .release-tooling

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: look for a recorded green run of this commit
        id:   plan
        env:
          PACKAGE:  ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
        run:  deno run --no-config --no-lock --allow-read --allow-write --allow-env --allow-net=api.github.com --allow-run=git .release-tooling/scripts/ci/release-plan.ts

  # Whole job skipped when the plan found a green run; one runner per unit shard otherwise.
  check:
    needs: plan
    if:    needs.plan.outputs.check_needed == 'true' && needs.plan.outputs.train_owned != 'true'
    name:  release check (${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.check_shards) }}
    runs-on:         ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: check out the release tooling at the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:  ${{ github.sha }}
          path: .release-tooling

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # The shared dependency cache already holds the rebuilt LMDB addon; a miss rebuilds it here.
      - uses: ./.release-tooling/.github/actions/common-release-setup
        with:
          do-fmt-check: "false"
          lmdb:         "true"

      - name: run this shard of the package-owned release check
        env:
          PACKAGE:      ${{ inputs.package }}
          SHARD_NAME:   ${{ matrix.shard.name }}
          UNIT_TARGETS: ${{ matrix.shard.targets }}
        run:  deno run -A --no-config --no-lock .release-tooling/scripts/ci/release-plan.ts run-check

  # Builds, verifies and smokes only the package under release. Nothing here loads the LMDB addon: the
  # build is a dnt transform and the smoke installs the tarball into a container from the registry.
  artifact:
    needs: [plan, check]
    # Runs after a green check or after the plan skipped it; never after a failed or cancelled check.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.train_owned != 'true' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on:         ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
      npm_name: ${{ steps.meta.outputs.npm_name }}
      tarball:  ${{ steps.build.outputs.tarball }}
      title:    ${{ steps.meta.outputs.title }}
      version:  ${{ steps.meta.outputs.version }}
    env:
      PACKAGE:  ${{ inputs.package }}
      TOOLING:  .release-tooling/scripts/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref:         ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: check out the release tooling at the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:  ${{ github.sha }}
          path: .release-tooling

      - uses: ./.release-tooling/.github/actions/common-release-setup
        with:
          do-fmt-check: "true"

      - name: read the package and require its tag to match the version
        id:   meta
        env:
          TAG: ${{ inputs.tag }}
        run:  bash "$TOOLING/release-artifact.sh" meta "$PACKAGE"

      - name: require a release commit from master
        if:   github.event_name == 'push' || inputs.tag != ''
        run:  git merge-base --is-ancestor HEAD origin/master

      - name: test package tooling
        run:  deno task test:package-tools

      - name: build and pack the package
        id:   build
        run:  bash "$TOOLING/release-artifact.sh" build "$PACKAGE"

      - name: verify the built dependencies match the planned graph
        if:   inputs.package != 'multisync'
        run:  deno run --no-config --no-lock --allow-read "$TOOLING/release-train.ts" verify "$PACKAGE"

      # The smoke installs the internal dependencies from npm: a publishing run waits until they are
      # visible; a dry run lists the ones npm does not have yet, built from this checkout instead.
      - name: wait for the internal dependencies on npm
        id:   deps
        env:
          PUBLISH: ${{ inputs.publish }}
        run:  deno run --no-config --no-lock --allow-read --allow-write --allow-env --allow-net=registry.npmjs.org "$TOOLING/release-train.ts" registry-deps "$PACKAGE"

      - name: build local stand-ins for dependencies npm does not have (dry run only)
        if:   steps.deps.outputs.local != ''
        run:  bash "$TOOLING/release-artifact.sh" build ${{ steps.deps.outputs.local }}

      - name: smoke the packed tarball
        env:
          SMOKE_NODE_IMAGE: node:20.3.0-bookworm-slim
        run:  bash "$TOOLING/release-artifact.sh" smoke "$PACKAGE" ${{ steps.deps.outputs.local }}

      - name: upload exact publish candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name:              ${{ steps.meta.outputs.artifact }}-${{ steps.meta.outputs.version }}
          path:              packages/${{ inputs.package }}/npm/${{ steps.build.outputs.tarball }}
          if-no-files-found: error
          retention-days:    3

  publish:
    # An explicit status function: without one GitHub applies success() over the whole needs chain, and a
    # skipped release check upstream of artifact (green evidence found) would skip publication.
    if:          ${{ !cancelled() && inputs.publish && needs.artifact.result == 'success' }}
    needs:       artifact
    runs-on:     ubuntu-latest
    environment: publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.artifact.outputs.artifact }}-${{ needs.artifact.outputs.version }}
          path: release-tarball

      - name: publish unless this exact version already exists
        env:
          NPM_NAME: ${{ needs.artifact.outputs.npm_name }}
          VERSION:  ${{ needs.artifact.outputs.version }}
        run: |
          if npm view "$NPM_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NPM_NAME@$VERSION is already published"
          else
            TARBALL=$(find "$GITHUB_WORKSPACE/release-tarball" -type f -name '*.tgz' | head -1)
            test -n "$TARBALL"
            npm publish "$TARBALL" --access public
          fi

  github-release:
    # Same explicit status check as publish; it also requires the publish job itself to have succeeded.
    if:      ${{ !cancelled() && inputs.publish && (github.event_name == 'push' || inputs.tag != '') && needs.artifact.result == 'success' && needs.publish.result == 'success' }}
    needs:   [artifact, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.artifact.outputs.artifact }}-${{ needs.artifact.outputs.version }}
          path: release-tarball

      - name: create or update the GitHub release
        env:
          GH_TOKEN:    ${{ github.token }}
          GH_REPO:     ${{ github.repository }}
          TITLE:       ${{ needs.artifact.outputs.title }} ${{ needs.artifact.outputs.version }}
          RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          TARBALL=$(find release-tarball -type f -name '*.tgz' | head -1)
          test -n "$TARBALL"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$TARBALL" --clobber
          else
            gh release create "$RELEASE_TAG" "$TARBALL" --title "$TITLE" --generate-notes --verify-tag
          fi
