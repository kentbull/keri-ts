name: macOS Compatibility

# Manual pre-release platform-compatibility workflow. Running a broad macOS
# matrix every week did not earn its keep; releases still require an explicit
# cross-platform proof when it matters.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the main CI toolchain exactly so OS is the primary variable changing.
  DENO_DIR: ${{ github.workspace }}/.deno-cache
  DENO_VERSION: "2.8.2"
  KERIPY_INTEROP_ROOT: ${{ github.workspace }}/.cache/keripy-mailbox-main
  KERIPY_INTEROP_PYTHON: ${{ github.workspace }}/.cache/keripy-venv/bin/python
  KERIPY_VENV: ${{ github.workspace }}/.cache/keripy-venv
  LMDB_DATA_V1: "true"
  NODE_VERSION: "25.9.0"
  PYTHON_VERSION: "3.14"
  DEPS_CACHE_KEY_PREFIX: ci-deps-v3
  INTEROP_NODE_MODULES_CACHE_KEY_PREFIX: interop-node-modules-v2
  KERIPY_CACHE_KEY_PREFIX: keripy-mailbox-source-v1

jobs:
  # Single job on purpose: this workflow is about end-to-end cross-platform
  # confidence, not fastest possible feedback.
  compatibility:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      # Keep action behavior pinned here too; platform checks are useless if the
      # surrounding automation drifts independently.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: select shared KERIpy qualification pin
        run: node -p '"KERIPY_INTEROP_EXPECTED_COMMIT=" + require("./scripts/ci/keripy-reference.json").commit' >> "$GITHUB_ENV"

      - name: restore Deno dependency cache
        id: deps-cache
        # Reuse as much bootstrap work as possible because hosted macOS time is
        # expensive, but keep the cache keyed to the full runtime contract.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DENO_DIR }}
            node_modules
          key: ${{ runner.os }}-${{ env.DEPS_CACHE_KEY_PREFIX }}-deno-${{ env.DENO_VERSION }}-node-${{ env.NODE_VERSION }}-lmdb-data-v1-napi-${{ hashFiles('packages/keri/scripts/setup_lmdb_v1.sh', 'deno.lock', 'deno.json', 'dprint.json', 'package-lock.json', 'packages/keri/deno.json', 'packages/cesr/deno.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.DEPS_CACHE_KEY_PREFIX }}-deno-${{ env.DENO_VERSION }}-node-${{ env.NODE_VERSION }}-lmdb-data-v1-napi-

      - name: restore interop LMDB node_modules cache
        id: interop-node-modules-cache
        # The shared deps cache is only bootstrap state. macOS interop runs
        # need a dedicated node_modules cache saved after `deno task setup`
        # rebuilds LMDB-js with the required v1 data format.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ env.INTEROP_NODE_MODULES_CACHE_KEY_PREFIX }}-deno-${{ env.DENO_VERSION }}-node-${{ env.NODE_VERSION }}-lmdb-data-v1-napi-${{ hashFiles('packages/keri/scripts/setup_lmdb_v1.sh', 'deno.lock', 'deno.json', 'dprint.json', 'package-lock.json', 'packages/keri/deno.json', 'packages/cesr/deno.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.INTEROP_NODE_MODULES_CACHE_KEY_PREFIX }}-deno-${{ env.DENO_VERSION }}-node-${{ env.NODE_VERSION }}-lmdb-data-v1-napi-

      - name: verify or rebuild LMDB-js data v1 and NAPI compatibility
        run: |
          if [[ "${{ steps.interop-node-modules-cache.outputs.cache-hit }}" != "true" ]] || ! deno run -A scripts/ci/report-lmdb-runtime.ts; then
            deno task setup:compat-lmdb
            deno run -A scripts/ci/report-lmdb-runtime.ts
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Separate resolver dependencies require 3.13; CLI selects 3.14.
          python-version: |
            3.13
            ${{ env.PYTHON_VERSION }}

      - name: install KERIpy native library
        # A cached venv still needs native libsodium. /bin/bash strips DYLD_*
        # variables, so expose Homebrew's dylib in ctypes' standard search path.
        # This is an ephemeral hosted runner; never replace a conflicting file.
        run: |
          brew install libsodium
          SODIUM_LIB="$(brew --prefix libsodium)/lib/libsodium.dylib"
          test -f "${SODIUM_LIB}"
          SODIUM_LINK=/usr/local/lib/libsodium.dylib
          if [[ -e "${SODIUM_LINK}" || -L "${SODIUM_LINK}" ]]; then
            [[ "${SODIUM_LINK}" -ef "${SODIUM_LIB}" ]]
          else
            sudo mkdir -p /usr/local/lib
            sudo ln -s "${SODIUM_LIB}" "${SODIUM_LINK}"
          fi

      - name: check out exact mailbox fork qualification peer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kentbull/keripy
          ref: ${{ env.KERIPY_INTEROP_EXPECTED_COMMIT }}
          path: .cache/keripy-mailbox-main

      - name: restore KERIpy virtualenv cache
        id: keripy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KERIPY_VENV }}
          key: ${{ runner.os }}-${{ env.KERIPY_CACHE_KEY_PREFIX }}-python-${{ env.PYTHON_VERSION }}-keripy-${{ env.KERIPY_INTEROP_EXPECTED_COMMIT }}

      - name: install pinned KERIpy CLI
        # Interop parity includes mailbox commands against both implementations.
        # PATH and shared helpers must use this same fork, independently of 927 tables.
        if: steps.keripy-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "${KERIPY_VENV}"
          "${KERIPY_VENV}/bin/python" -m pip install --upgrade pip
          "${KERIPY_VENV}/bin/python" -m pip install -e "${KERIPY_INTEROP_ROOT}"

      - name: verify imported fork source before running scenarios
        run: >-
          "${KERIPY_INTEROP_PYTHON}" scripts/ci/probe-keripy.py
          --root "${KERIPY_INTEROP_ROOT}"
          --expected-commit "${KERIPY_INTEROP_EXPECTED_COMMIT}"

      - name: add KERIpy CLI to PATH
        run: echo "${KERIPY_VENV}/bin" >> "$GITHUB_PATH"

      - name: assert environment
        # Print the macOS-side runtime, Python, LMDB, and KLI state before the
        # actual compatibility work starts.
        env:
          EXPECTED_DENO_VERSION: ${{ env.DENO_VERSION }}
          EXPECTED_NODE_VERSION: ${{ env.NODE_VERSION }}
          EXPECT_KLI: "true"
        run: |
          python scripts/ci/report-sodium-environment.py "$(brew --prefix libsodium)/lib/libsodium.dylib"
          bash scripts/ci/assert-environment.sh

      - name: Prepare pinned main protocol and storage peer
        uses: ./.github/actions/setup-keripy-main-peer

      - name: run macOS quality and test suites
        # Re-run the main quality and test surface on macOS so native/runtime
        # issues do not hide behind Linux-only PR validation.
        env:
          BUILD_METADATA: ""
          KERI_TS_BUILD_METADATA: ""
          CESR_TS_BUILD_METADATA: ""
        run: |
          deno task quality:check
          deno task test:quality

      - name: build npm packages
        # Packaging is part of compatibility too. Native/runtime issues often
        # appear only once DNT/npm artifacts are built.
        run: deno task npm:build:all

      - name: pack keri-ts npm tarball
        id: pack-keri
        run: |
          cd packages/keri/npm
          TARBALL="$(npm pack --silent | tail -n 1)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: pack cesr-ts npm tarball
        id: pack-cesr
        run: |
          cd packages/cesr/npm
          TARBALL="$(npm pack --silent | tail -n 1)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: pack tufa npm tarball
        id: pack-tufa
        run: |
          cd packages/tufa/npm
          TARBALL="$(npm pack --silent | tail -n 1)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: pack verifier npm tarball
        id: pack-verifier
        run: |
          cd packages/verifier/npm
          TARBALL="$(npm pack --silent | tail -n 1)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: pack hosting npm tarball
        id: pack-hosting
        run: |
          cd packages/hosting/npm
          TARBALL="$(npm pack --silent | tail -n 1)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: pack wallet npm tarball
        id: pack-wallet
        run: |
          cd packages/wallet/npm
          TARBALL="$(npm pack --silent | tail -n 1)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: pack registrar npm tarball
        id: pack-registrar
        run: |
          cd packages/registrar/npm
          TARBALL="$(npm pack --silent | tail -n 1)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: pack observer npm tarball
        id: pack-observer
        run: |
          cd packages/observer/npm
          TARBALL="$(npm pack --silent | tail -n 1)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: smoke test keri-ts tarball on macOS
        # Install and execute the actual packed tarballs on macOS to catch
        # platform-specific npm/bin/runtime issues after packaging.
        run: |
          TARBALL="${GITHUB_WORKSPACE}/packages/keri/npm/${{ steps.pack-keri.outputs.tarball }}"
          CESR_TARBALL="${GITHUB_WORKSPACE}/packages/cesr/npm/${{ steps.pack-cesr.outputs.tarball }}"
          TUFA_TARBALL="${GITHUB_WORKSPACE}/packages/tufa/npm/${{ steps.pack-tufa.outputs.tarball }}"
          VERIFIER_TARBALL="${GITHUB_WORKSPACE}/packages/verifier/npm/${{ steps.pack-verifier.outputs.tarball }}"
          HOSTING_TARBALL="${GITHUB_WORKSPACE}/packages/hosting/npm/${{ steps.pack-hosting.outputs.tarball }}"
          WALLET_TARBALL="${GITHUB_WORKSPACE}/packages/wallet/npm/${{ steps.pack-wallet.outputs.tarball }}"
          REGISTRAR_TARBALL="${GITHUB_WORKSPACE}/packages/registrar/npm/${{ steps.pack-registrar.outputs.tarball }}"
          OBSERVER_TARBALL="${GITHUB_WORKSPACE}/packages/observer/npm/${{ steps.pack-observer.outputs.tarball }}"
          SAMPLE="${GITHUB_WORKSPACE}/samples/cesr-streams/CESR_1_0-oor-auth-vc.cesr"
          TMP_DIR="$(mktemp -d)"
          cd "${TMP_DIR}"
          npm init -y >/dev/null
          npm install "${CESR_TARBALL}" "${TARBALL}" "${VERIFIER_TARBALL}" "${HOSTING_TARBALL}" "${WALLET_TARBALL}" "${REGISTRAR_TARBALL}" "${OBSERVER_TARBALL}" "${TUFA_TARBALL}" >/dev/null
          TUFA_BIN="${TMP_DIR}/node_modules/.bin/tufa"
          test -x "${TUFA_BIN}"
          V1="$("${TUFA_BIN}" version | tr -d '\r')"
          V2="$("${TUFA_BIN}" --version | tr -d '\r')"
          [[ "${V1}" == "${V2}" ]]
          OUT="$("${TUFA_BIN}" annotate --in "${SAMPLE}" | awk 'NR==1{print; exit}')"
          echo "${OUT}" | grep -q 'SERDER KERI JSON'
          # Resolve imports from this fresh install, never workspace dependencies.
          cp "${GITHUB_WORKSPACE}/scripts/npm/package-targets.mjs" .
          cp "${GITHUB_WORKSPACE}/scripts/npm/smoke-keri-installed.mjs" .
          cp "${GITHUB_WORKSPACE}/scripts/npm/smoke-tufa-authoring.mjs" .
          node ./smoke-keri-installed.mjs
          node ./smoke-tufa-authoring.mjs
          cp "${GITHUB_WORKSPACE}/scripts/npm/smoke-tufa-runtime.mjs" .
          node ./smoke-tufa-runtime.mjs "${TMP_DIR}/node_modules/@keri-ts/tufa"
          "${TMP_DIR}/node_modules/.bin/tephra" validate --in "${SAMPLE}"
          # Compiler tools are installed only after native/runtime probes pass.
          cp "${GITHUB_WORKSPACE}/scripts/npm/keri-consumer.ts" .
          cp "${GITHUB_WORKSPACE}/scripts/npm/tufa-consumer.ts" .
          node "${GITHUB_WORKSPACE}/scripts/npm/smoke-installed-declarations.mjs" \
            ./keri-consumer.ts ./tufa-consumer.ts

      - name: upload npm tarballs
        # Keep the macOS-built artifacts for later comparison with Linux builds.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs-macos-${{ github.run_id }}
          path: |
            packages/keri/npm/${{ steps.pack-keri.outputs.tarball }}
            packages/cesr/npm/${{ steps.pack-cesr.outputs.tarball }}
            packages/tufa/npm/${{ steps.pack-tufa.outputs.tarball }}
            packages/verifier/npm/${{ steps.pack-verifier.outputs.tarball }}
            packages/hosting/npm/${{ steps.pack-hosting.outputs.tarball }}
            packages/wallet/npm/${{ steps.pack-wallet.outputs.tarball }}
            packages/registrar/npm/${{ steps.pack-registrar.outputs.tarball }}
            packages/observer/npm/${{ steps.pack-observer.outputs.tarball }}
          if-no-files-found: error
          retention-days: 14
