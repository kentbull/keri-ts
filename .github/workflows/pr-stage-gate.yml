name: PR Stage Gate

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-stage-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DENO_DIR: ${{ github.workspace }}/.deno-cache
  DENO_VERSION: "2.8.2"
  NODE_VERSION: "25.9.0"
  PYTHON_VERSION: "3.14"
  LMDB_DATA_V1: "true"
  DEPS_CACHE_KEY_PREFIX: ci-deps-v6
  KERIPY_GIT_URL: https://github.com/kentbull/keripy.git
  KERIPY_GIT_SHA: 450ae1c2a7eac61d92bc7b830cb6883c41e6a798
  KERIPY_VENV: ${{ github.workspace }}/.cache/keripy-venv
  KERIPY_CACHE_KEY_PREFIX: keripy-v2-mailbox-impl
  KERI_TEST_TIMINGS_DIR: ${{ github.workspace }}/.test-timings

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup
        uses: ./.github/actions/common-release-setup
        with:
          do-fmt-check: "false"

      - name: verify immutable action pins
        run: bash scripts/ci/check-action-pins.sh

      - name: check formatting, lint, and quality
        env:
          BUILD_METADATA: ""
          KERI_TS_BUILD_METADATA: ""
          CESR_TS_BUILD_METADATA: ""
        run: deno task fmt:check && deno task lint && deno task quality:check

  changeset-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_unit: ${{ steps.scope.outputs.run_unit }}
      run_interop: ${{ steps.scope.outputs.run_interop }}
      run_package: ${{ steps.scope.outputs.run_package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: select checks that can be affected
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_unit=false
          run_interop=false
          run_package=false

          while IFS= read -r file; do
            case "$file" in
              .github/workflows/pr-stage-gate.yml|.github/actions/common-release-setup/*|deno.json|deno.lock|package.json|package-lock.json)
                run_unit=true
                run_interop=true
                run_package=true
                ;;
              packages/*)
                run_unit=true
                run_package=true
                ;;
              scripts/ci/run-*.ts|scripts/setup-lmdb-v1.sh)
                run_unit=true
                ;;
            esac

            case "$file" in
              packages/cesr/*|packages/keri/*|scripts/ci/interop-*|scripts/ci/run-interop-*)
                run_interop=true
                ;;
            esac

            case "$file" in
              .github/workflows/npm-release.yml|scripts/npm/*|scripts/smoke-test-*|scripts/build-*)
                run_package=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "run_unit=$run_unit" >> "$GITHUB_OUTPUT"
          echo "run_interop=$run_interop" >> "$GITHUB_OUTPUT"
          echo "run_package=$run_package" >> "$GITHUB_OUTPUT"

      - name: require release intent
        run: bash scripts/ci/check-changeset.sh "${{ github.event.pull_request.base.sha }}"

  unit-tests:
    needs: changeset-required
    if: needs.changeset-required.outputs.run_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup
        uses: ./.github/actions/common-release-setup
        with:
          do-fmt-check: "false"
          cache-key-extra: lmdb-v1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: rebuild LMDB-js for KERI compatibility
        if: steps.setup.outputs.cache-hit != 'true'
        run: deno task setup:compat-lmdb

      - name: run the maintained package and runtime suites once
        run: |
          deno task test:quality:keri:db-fast
          deno task test:quality:keri:core-fast-a
          deno task test:quality:keri:core-fast-b
          deno task test:quality:keri:app-fast
          deno task test:quality:keri:runtime-medium
          deno task test:quality:keri:runtime-slow
          deno task test:quality:keri:app-stateful-a
          deno task test:quality:keri:app-stateful-b
          deno task test:quality:tufa
          deno task test:cesr

  interop-parity:
    needs: changeset-required
    if: needs.changeset-required.outputs.run_interop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup
        uses: ./.github/actions/common-release-setup
        with:
          do-fmt-check: "false"
          cache-key-extra: lmdb-v1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: rebuild LMDB-js for KERI compatibility
        if: steps.setup.outputs.cache-hit != 'true'
        run: deno task setup:compat-lmdb

      - name: restore KERIpy virtualenv
        id: keripy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KERIPY_VENV }}
          key: ${{ runner.os }}-${{ env.KERIPY_CACHE_KEY_PREFIX }}-python-${{ env.PYTHON_VERSION }}-keripy-${{ env.KERIPY_GIT_SHA }}

      - name: install pinned KERIpy CLI
        if: steps.keripy-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "${KERIPY_VENV}"
          "${KERIPY_VENV}/bin/python" -m pip install --upgrade pip
          "${KERIPY_VENV}/bin/python" -m pip install "git+${KERIPY_GIT_URL}@${KERIPY_GIT_SHA}"

      - name: add KERIpy CLI to PATH
        run: echo "${KERIPY_VENV}/bin" >> "$GITHUB_PATH"

      - name: run representative KERIpy parity
        run: deno task test:quality:keri:interop-parity

      - name: retain parity timings on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keri-interop-parity-timings-pr-${{ github.event.pull_request.number }}
          path: .test-timings/*.json
          if-no-files-found: ignore
          retention-days: 3

  package-smoke:
    needs: changeset-required
    if: needs.changeset-required.outputs.run_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/common-release-setup
        with:
          do-fmt-check: "false"

      - name: build npm packages
        run: deno task npm:build:all

      - name: pack npm tarballs
        id: pack
        run: |
          cd packages/keri/npm
          echo "keri=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
          cd ../../cesr/npm
          echo "cesr=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
          cd ../../tufa/npm
          echo "tufa=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: smoke test exact packages on glibc
        env:
          SMOKE_NODE_IMAGE: node:bookworm-slim
        run: |
          bash scripts/smoke-test-pr-packages-npm.sh \
            "packages/keri/npm/${{ steps.pack.outputs.keri }}" \
            "packages/cesr/npm/${{ steps.pack.outputs.cesr }}" \
            "packages/tufa/npm/${{ steps.pack.outputs.tufa }}"

      - name: smoke test exact packages on Alpine
        env:
          SMOKE_NODE_IMAGE: node:alpine
        run: |
          bash scripts/smoke-test-pr-packages-npm.sh \
            "packages/keri/npm/${{ steps.pack.outputs.keri }}" \
            "packages/cesr/npm/${{ steps.pack.outputs.cesr }}" \
            "packages/tufa/npm/${{ steps.pack.outputs.tufa }}"

      - name: retain packages on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs-pr-${{ github.event.pull_request.number }}
          path: |
            packages/keri/npm/${{ steps.pack.outputs.keri }}
            packages/cesr/npm/${{ steps.pack.outputs.cesr }}
            packages/tufa/npm/${{ steps.pack.outputs.tufa }}
          if-no-files-found: ignore
          retention-days: 3

  stage-gate:
    if: ${{ always() }}
    needs: [static-checks, changeset-required, unit-tests, interop-parity, package-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require every maintained gate
        env:
          STATIC: ${{ needs.static-checks.result }}
          CHANGESET: ${{ needs.changeset-required.result }}
          UNIT: ${{ needs.unit-tests.result }}
          INTEROP: ${{ needs.interop-parity.result }}
          PACKAGE: ${{ needs.package-smoke.result }}
        run: |
          test "$STATIC" = success
          test "$CHANGESET" = success
          test "$UNIT" = success || test "$UNIT" = skipped
          test "$INTEROP" = success || test "$INTEROP" = skipped
          test "$PACKAGE" = success || test "$PACKAGE" = skipped
