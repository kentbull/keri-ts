name: PR Stage Gate

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-stage-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DENO_DIR: ${{ github.workspace }}/.deno-cache
  DENO_VERSION: "2.9.8"
  NODE_VERSION: "25.9.0"
  PYTHON_VERSION: "3.14"
  LMDB_DATA_V1: "true"
  DEPS_CACHE_KEY_PREFIX: ci-deps-v6
  KERIPY_TABLE_SHA: 7143832813cac6a394ab1faf9be83bb3372be87c
  KERI_TEST_TIMINGS_DIR: ${{ github.workspace }}/.test-timings

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup
        uses: ./.github/actions/common-release-setup
        with:
          do-fmt-check: "false"

      - name: verify immutable action pins
        run: bash scripts/ci/check-action-pins.sh

      - name: check formatting, lint, and quality
        env:
          BUILD_METADATA: ""
          KERI_TS_BUILD_METADATA: ""
          CESR_TS_BUILD_METADATA: ""
        run: deno task fmt:check && deno task lint && deno task quality:check

  changeset-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_unit: ${{ steps.scope.outputs.run_unit }}
      run_interop: ${{ steps.scope.outputs.run_interop }}
      run_package: ${{ steps.scope.outputs.run_package }}
      unit_targets: ${{ steps.scope.outputs.unit_targets }}
      interop_targets: ${{ steps.scope.outputs.interop_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: select checks from current PR scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_AUTHOR: ${{ github.event.pull_request.user.login }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_METADATA: ${{ runner.temp }}/pr-scope.json
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$PR_METADATA"
          deno run --no-config --no-lock --allow-read --allow-write --allow-env --allow-run=git scripts/ci/pr-test-scope.ts

      - name: require release intent
        run: bash scripts/ci/check-changeset.sh "${{ github.event.pull_request.base.sha }}"

  unit-tests:
    needs: changeset-required
    if: needs.changeset-required.outputs.run_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup
        uses: ./.github/actions/common-release-setup
        with:
          do-fmt-check: "false"
          cache-key-extra: lmdb-v1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: rebuild LMDB-js for KERI compatibility
        run: |
          if [[ "${{ steps.setup.outputs.cache-hit }}" != "true" ]] || ! deno run -A scripts/ci/report-lmdb-runtime.ts; then
            deno task setup:compat-lmdb
            deno run -A scripts/ci/report-lmdb-runtime.ts
          fi

      - name: run selected unit suites
        shell: bash
        env:
          UNIT_TARGETS: ${{ needs.changeset-required.outputs.unit_targets }}
        run: |
          mkdir -p .test-timings
          deno run -A scripts/ci/pr-test-scope.ts run-unit 2>&1 | tee .test-timings/required.log

      - name: retain required-suite timings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keri-required-timings-pr-${{ github.event.pull_request.number }}
          path: .test-timings/
          if-no-files-found: ignore
          retention-days: 14

  interop-parity:
    needs: changeset-required
    if: needs.changeset-required.outputs.run_interop == 'true'
    name: interop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changeset-required.outputs.interop_targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup
        uses: ./.github/actions/common-release-setup
        with:
          do-fmt-check: "false"
          cache-key-extra: lmdb-v1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.13
            ${{ env.PYTHON_VERSION }}

      - name: rebuild LMDB-js for KERI compatibility
        run: |
          if [[ "${{ steps.setup.outputs.cache-hit }}" != "true" ]] || ! deno run -A scripts/ci/report-lmdb-runtime.ts; then
            deno task setup:compat-lmdb
            deno run -A scripts/ci/report-lmdb-runtime.ts
          fi

      - name: check out pinned KERIpy table source
        if: matrix.target == 'interop-parity'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kentbull/keripy
          ref: ${{ env.KERIPY_TABLE_SHA }}
          path: .cache/keripy-source

      - name: verify CESR tables against frozen table reference
        if: matrix.target == 'interop-parity'
        env:
          KERIPY_PATH: ${{ github.workspace }}/.cache/keripy-source
        run: deno run -A packages/cesr/scripts/verify-tables.ts

      - name: Prepare pinned main protocol and storage peer
        if: matrix.target == 'interop-essr-storage'
        uses: ./.github/actions/setup-keripy-main-peer

      - name: Prepare pinned native candidate peer
        if: contains(fromJSON('["interop-native-registry", "interop-ipex-disclosure", "interop-kram"]'), matrix.target)
        uses: ./.github/actions/setup-keripy-main-peer
        with:
          profile: candidate
          services: ${{ matrix.target == 'interop-native-registry' }}

      - name: run selected KERIpy interop owner
        shell: bash
        env:
          INTEROP_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p .test-timings
          deno run -A scripts/ci/run-keri-test-group.ts "$INTEROP_TARGET" 2>&1 | tee .test-timings/parity.log

      - name: retain parity timings and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keri-${{ matrix.target }}-timings-pr-${{ github.event.pull_request.number }}
          path: .test-timings/
          if-no-files-found: ignore
          retention-days: 3

  package-smoke:
    needs: changeset-required
    if: needs.changeset-required.outputs.run_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/common-release-setup
        with:
          do-fmt-check: "false"

      - name: test package tooling
        run: deno task test:package-tools

      - name: build npm packages
        run: deno task npm:build:all

      - name: pack npm tarballs
        id: pack
        run: |
          cd packages/keri/npm
          echo "keri=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
          cd ../../cesr/npm
          echo "cesr=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
          cd ../../tufa/npm
          echo "tufa=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
          cd ../../verifier/npm
          echo "verifier=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
          cd ../../hosting/npm
          echo "hosting=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
          cd ../../wallet/npm
          echo "wallet=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
          cd ../../registrar/npm
          echo "registrar=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
          cd ../../observer/npm
          echo "observer=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: smoke test exact packages on the minimum Node version
        env:
          SMOKE_NODE_IMAGE: node:20.3.0-bookworm-slim
        run: |
          bash scripts/smoke-test-pr-packages-npm.sh \
            "packages/keri/npm/${{ steps.pack.outputs.keri }}" \
            "packages/cesr/npm/${{ steps.pack.outputs.cesr }}" \
            "packages/tufa/npm/${{ steps.pack.outputs.tufa }}" \
            "packages/verifier/npm/${{ steps.pack.outputs.verifier }}" \
            "packages/hosting/npm/${{ steps.pack.outputs.hosting }}" \
            "packages/wallet/npm/${{ steps.pack.outputs.wallet }}" \
            "packages/registrar/npm/${{ steps.pack.outputs.registrar }}" \
            "packages/observer/npm/${{ steps.pack.outputs.observer }}"

      - name: smoke test exact packages on Alpine
        env:
          SMOKE_NODE_IMAGE: node:alpine
        run: |
          bash scripts/smoke-test-pr-packages-npm.sh \
            "packages/keri/npm/${{ steps.pack.outputs.keri }}" \
            "packages/cesr/npm/${{ steps.pack.outputs.cesr }}" \
            "packages/tufa/npm/${{ steps.pack.outputs.tufa }}" \
            "packages/verifier/npm/${{ steps.pack.outputs.verifier }}" \
            "packages/hosting/npm/${{ steps.pack.outputs.hosting }}" \
            "packages/wallet/npm/${{ steps.pack.outputs.wallet }}" \
            "packages/registrar/npm/${{ steps.pack.outputs.registrar }}" \
            "packages/observer/npm/${{ steps.pack.outputs.observer }}"

      - name: smoke test exact packages on pointer-compressed Node
        env:
          SMOKE_NODE_IMAGE: platformatic/node-caged:26-slim@sha256:fa80c7804a23484a3b707733f8b3d0e45a93babd7ce6ae6e29312ed2c1eb8403
        run: |
          docker run --rm "$SMOKE_NODE_IMAGE" node -e '
            const enabled = process.config.variables.v8_enable_pointer_compression;
            console.log(JSON.stringify({ node: process.version, v8: process.versions.v8, pointerCompression: enabled }));
            if (enabled !== 1) throw new Error("Expected a pointer-compressed Node build");
          '
          bash scripts/smoke-test-pr-packages-npm.sh \
            "packages/keri/npm/${{ steps.pack.outputs.keri }}" \
            "packages/cesr/npm/${{ steps.pack.outputs.cesr }}" \
            "packages/tufa/npm/${{ steps.pack.outputs.tufa }}" \
            "packages/verifier/npm/${{ steps.pack.outputs.verifier }}" \
            "packages/hosting/npm/${{ steps.pack.outputs.hosting }}" \
            "packages/wallet/npm/${{ steps.pack.outputs.wallet }}" \
            "packages/registrar/npm/${{ steps.pack.outputs.registrar }}" \
            "packages/observer/npm/${{ steps.pack.outputs.observer }}"

      - name: retain packages on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs-pr-${{ github.event.pull_request.number }}
          path: |
            packages/keri/npm/${{ steps.pack.outputs.keri }}
            packages/cesr/npm/${{ steps.pack.outputs.cesr }}
            packages/tufa/npm/${{ steps.pack.outputs.tufa }}
            packages/verifier/npm/${{ steps.pack.outputs.verifier }}
            packages/hosting/npm/${{ steps.pack.outputs.hosting }}
            packages/wallet/npm/${{ steps.pack.outputs.wallet }}
            packages/registrar/npm/${{ steps.pack.outputs.registrar }}
            packages/observer/npm/${{ steps.pack.outputs.observer }}
          if-no-files-found: ignore
          retention-days: 3

  stage-gate:
    if: ${{ always() }}
    needs: [static-checks, changeset-required, unit-tests, interop-parity, package-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require every maintained gate
        env:
          STATIC: ${{ needs.static-checks.result }}
          CHANGESET: ${{ needs.changeset-required.result }}
          UNIT: ${{ needs.unit-tests.result }}
          INTEROP: ${{ needs.interop-parity.result }}
          PACKAGE: ${{ needs.package-smoke.result }}
        run: |
          test "$STATIC" = success
          test "$CHANGESET" = success
          test "$UNIT" = success || test "$UNIT" = skipped
          test "$INTEROP" = success || test "$INTEROP" = skipped
          test "$PACKAGE" = success || test "$PACKAGE" = skipped
